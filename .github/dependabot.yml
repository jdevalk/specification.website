version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check 0.9.10 peers typescript "^5.0.0 || ^6.0.0", so a v7
      # bump makes `npm ci` fail with ERESOLVE and every job in every
      # workflow dies at install (#155, #164 — both regenerated weekly and
      # neither could ever go green). The bump also drags the rest of the
      # dev-deps group down with it. Re-allow once @astrojs/check widens
      # its peer range to accept v7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      dev-deps:
        dependency-type: development

  - package-ecosystem: npm
    directory: "/mcp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # wrangler's peer range only accepts workers-types v4; a v5 bump
      # breaks `npm ci` in the Deploy MCP workflow. Re-allow once
      # wrangler's peerDependencies accept v5.
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
