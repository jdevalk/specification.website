# Cloudflare Worker — The Website Specification MCP server.
# Deploy with: `npm run deploy` (after `wrangler login` once).
#
# Point the custom_domain at mcp.specification.website. The first deploy
# automatically registers the subdomain with Cloudflare's edge as long as
# the parent zone (specification.website) is on Cloudflare.

name = "specification-website-mcp"
main = "src/index.ts"
account_id = "c53e64d218c83cb220b523a637ffd079"
# Pin bundling to this Worker's own self-contained tsconfig. Without it,
# esbuild walks up to the repo-root tsconfig (which extends
# astro/tsconfigs/strict); in the deploy CI job only mcp/ deps are installed,
# so astro is absent and esbuild warns it can't find that base config.
tsconfig = "tsconfig.json"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

# Production: bind the public hostname.
[[routes]]
pattern = "mcp.specification.website"
custom_domain = true

# Observability — Workers Analytics + tail logs.
[observability]
enabled = true

# Analytics Engine — per-call MCP/A2A usage log. Read by the Pages
# /admin/stats dashboard via the Cloudflare Analytics Engine SQL API.
# Same account, different binding namespace — datasets are account-scoped.
[[analytics_engine_datasets]]
binding = "MCP_LOG"
dataset = "sw_mcp_log"

# Public feedback submission: approximate per-location cap, shared by callers.
# The dedicated FEEDBACK_GITHUB_TOKEN secret needs Issues: write on this repo.
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1911495501"
simple = { limit = 3, period = 60 }
